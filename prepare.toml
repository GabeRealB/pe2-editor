# What a build of the editor needs that is no crate, fetched by `cargo xtask prepare`, each entry as an extension's
# `[[setup]]` is and held to its hashes (`cargo xtask hash prepare.toml --write` finds them). An entry for a platform goes
# to `prepared/<platform>/`: a build for that platform fails until it is prepared, and puts it beside the programs it
# makes (`crates/editor/build.rs`); `cargo xtask dist` prepares first, and ships it beside the programs. An entry for no
# platform is what the build itself reads on every platform, in `prepared/common/`, and ships with none.

