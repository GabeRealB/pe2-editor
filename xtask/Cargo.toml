[package]
name = "xtask"
description = "The editor's own tasks: `cargo xtask dist` lays the editor and the extensions built apart from it out as they ship, `cargo xtask package` archives each"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
codecs.workspace = true
anyhow.workspace = true
sha2.workspace = true
toml.workspace = true
pe2-setup.workspace = true
licenses.workspace = true
ureq.workspace = true
tar.workspace = true
lzma-rust2.workspace = true
# Zig downloads from community mirrors, its signature checked with Zig's key (`packages`).
minisign-verify = "0.3"
