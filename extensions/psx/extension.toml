# maspsx runs the assembler itself: the one fetched, by the name psx calls it - or, where none was, the system's.
[[launch]]
name = "maspsx"
platform = "linux-x86_64"
program = "python/bin/python3"
args = ["-B", "@maspsx/maspsx.py", "--gnu-as-path", "@mips-linux-gnu-as"]

[[launch]]
name = "maspsx"
platform = "macos-aarch64"
program = "python/bin/python3"
args = ["-B", "@maspsx/maspsx.py", "--gnu-as-path", "@mips-linux-gnu-as"]

[[launch]]
name = "maspsx"
platform = "windows-x86_64"
program = "python/bin/python3.exe"
args = ["-B", "@maspsx/maspsx.py", "--gnu-as-path", "@mips-linux-gnu-as.exe"]
