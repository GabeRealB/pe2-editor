[package]
name = "pe2-path"
description = "The editor's paths as types: a name, a relative path, a uid, a resource path (a uid and a suffix), a path within a scope of the virtual filesystem, and a path on disk for the filesystem's implementations; each checked when made"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["rc"] }
icu_normalizer.workspace = true

[build-dependencies]
# The fold's table, made of what `prepare.toml` pins (`build.rs`), held to its hashes.
toml.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
