[package]
name = "sfs"
description = "The filesystem a project's processes share: a write-ahead log that holds every operation in transit with its bytes, and the state they all map"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
memmap2 = "0.9"
crc32fast = "1"

# The ring of pages, in memory Windows keeps for the processes that name it (`ring::Ring::shared`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }
