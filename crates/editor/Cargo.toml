[package]
name = "editor"
description = "pe2-editor: the project editor"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "pe2-editor"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codecs.workspace = true
project.workspace = true
extensions.workspace = true
pe2-ext.workspace = true
pe2-webgpu.workspace = true
mcp.workspace = true
anyhow.workspace = true
eframe.workspace = true
sysinfo.workspace = true
egui_tiles.workspace = true
egui_extras.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
cpal.workspace = true
png.workspace = true
toml.workspace = true
toml_edit.workspace = true
# The event loop is the editor's own: it is what knows the monitors (main.rs).
winit.workspace = true

# The GPU's use, as Windows counts it (gpu_stats.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }
