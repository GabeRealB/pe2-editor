[package]
name = "editor"
description = "pe2-editor: the project editor"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "editor"
path = "src/lib.rs"

[[bin]]
name = "pe2-editor"
path = "src/engine.rs"

[[bin]]
name = "pe2-test-runner"
path = "src/test_runner.rs"
required-features = ["tests"]

[lints]
workspace = true

[dependencies]
codecs.workspace = true
project.workspace = true
extensions.workspace = true
pe2-ext.workspace = true
pe2-webgpu.workspace = true
mcp.workspace = true
anyhow.workspace = true
eframe.workspace = true
sysinfo.workspace = true
egui_tiles.workspace = true
egui_extras.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
cpal.workspace = true
png.workspace = true
toml.workspace = true
toml_edit.workspace = true
# The event loop is the editor's own: it is what knows the monitors (main.rs).
winit.workspace = true

# Runs the editor with no window: scenarios (src/scenario).
egui_kittest = { workspace = true, optional = true }

[features]
# `pe2-test-runner`, a build for testing: what ships has no harness in it.
tests = ["dep:egui_kittest"]

[dev-dependencies]
egui_kittest.workspace = true
