[package]
name = "pe2-ext-macros"
description = "The extension SDK's macros: `extension!`, which declares an extension from its manifest, and `#[steps]`"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# `#[steps]` reads the function it cuts (stepping.rs).
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
toml.workspace = true
sha2.workspace = true
