[package]
name = "pe2-setup"
description = "What an unsandboxed extension fetches onto a machine ([[setup]] of its manifest): downloaded, held to its hashes, unpacked, patched and kept; and the hashes found for its author"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
codecs.workspace = true
anyhow.workspace = true
serde.workspace = true
sha2.workspace = true
ureq.workspace = true
flate2.workspace = true
lzma-rust2.workspace = true
tar.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
# Tests make the .tar.xz downloads they unpack.
lzma-rust2 = { workspace = true, features = ["encoder"] }
