# Every source the packages are built from, as `cargo xtask packages` names it in a release and licenses it in an
# archive: the sources zig fetches (each by the exact URL a manifest fetches it from - a URL changed is a component no
# entry here describes, which fails the task by name), and the zig they are built with.
#
# - `name`, `version`: what its source archive in a release is named (`<name>-<version>.tar.gz`); the URL must name the
#   version.
# - `license`: SPDX's expression of it where it has one; `license_files`: the files of its source carrying it, which an
#   archive it is linked into holds as `licenses/<name>/<file>`; `upstream`: where it comes from.
# - `role`: `linked` - its code is in what ships - or `tool`, used only to build (nasm, allyourcodebase's build scripts);
#   `platforms`, where it is linked when not on every platform (elsewhere it is a tool or not used); `packages`, which
#   packages it is linked into when not every one that fetches it.

# The zig every package is built with: its compiler-rt and, as a target needs them, the C and C++ runtimes it carries
# (musl, MinGW-w64's, glibc's stubs, libc++, libc++abi, libunwind) are linked into what ships; aro-cpp is made of aro, which it
# carries.
[[component]]
zig = true
name = "zig"
version = "0.17.1"
license = "MIT AND Apache-2.0 WITH LLVM-exception AND (see each runtime's file)"
license_files = ["LICENSE", "lib/libc/musl/COPYRIGHT", "lib/libc/mingw/COPYING", "lib/libc/glibc/LICENSES", "lib/libcxx/LICENSE.TXT", "lib/libcxxabi/LICENSE.TXT", "lib/libunwind/LICENSE.TXT"]
upstream = "https://ziglang.org"
role = "linked"

