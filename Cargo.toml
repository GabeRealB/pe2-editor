# Tier 2: the editor and its tools, one library crate a tool, linked into `pe2-cli` and the editor.

[workspace]
resolver = "2"
members = [
    "crates/formats",
    "crates/codecs",
    "crates/typeface",
    "crates/vfs",
    "crates/sfs",
    "crates/value",
    "crates/ext",
    "crates/ext-macros",
    "crates/setup",
    "crates/model",
    "crates/project",
    "crates/webgpu",
    "crates/mcp",
    "crates/holder",
    "crates/cli",
    "crates/editor",
    "xtask",
    "extensions",
    "extensions/dialogue",
    "extensions/flags",
    "extensions/fonts",
    "extensions/formats",
    "extensions/game",
    "extensions/images",
    "extensions/movies",
    "extensions/packages",
    "extensions/str",
    "extensions/sounds",
    "extensions/ffmpeg",
    "extensions/psx",
    "extensions/render/tests",
    "extensions/images/tests",
    "extensions/test_data",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Every warning is an error, Clippy's included; Clippy's pedantic group is on.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# Spans over what the editor and its tools spend time on (project::profile): totaled by name for `--profile` and
# `editor_performance`, and shown on a timeline by Tracy in builds with the `tracy` feature.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-tracy = "0.12"
formats = { path = "crates/formats" }
pe2-model = { path = "crates/model" }
codecs = { path = "crates/codecs" }
typeface = { path = "crates/typeface" }
vfs = { path = "crates/vfs" }
pe2-value = { path = "crates/value" }
project = { path = "crates/project" }
pe2-ext = { path = "crates/ext" }
pe2-ext-macros = { path = "crates/ext-macros" }
pe2-setup = { path = "crates/setup" }
# The guest side of the extensions' contract (crates/ext/wit), for extensions built as components.
wit-bindgen = "0.63"
# The host of the extensions built as components: wasmtime with what WASI 0.3 components need, no more.
wasmtime = { version = "50", default-features = false, features = ["anyhow", "runtime", "cranelift", "component-model", "component-model-async", "std", "parallel-compilation", "addr2line", "demangle", "pooling-allocator"] }
wasmparser = "0.261"
wasmtime-wasi = { version = "50", default-features = false, features = ["p3"] }
# The built-in extensions (`extensions/`) and the list of them the editor ships.
extensions = { path = "extensions" }
pe2-fonts = { path = "extensions/fonts" }
pe2-formats = { path = "extensions/formats" }
pe2-test-data = { path = "extensions/test_data" }
pe2-game = { path = "extensions/game" }
pe2-images = { path = "extensions/images" }
pe2-movies = { path = "extensions/movies" }
pe2-dialogue = { path = "extensions/dialogue" }
pe2-events = { path = "extensions/events" }
pe2-graph = { path = "extensions/graph" }
pe2-flags = { path = "extensions/flags" }
pe2-render = { path = "extensions/render" }
pe2-webgpu = { path = "crates/webgpu" }
pe2-packages = { path = "extensions/packages" }
pe2-str = { path = "extensions/str" }
pe2-sounds = { path = "extensions/sounds" }
mcp = { path = "crates/mcp" }
holder = { path = "crates/holder" }
# The Model Context Protocol's official Rust SDK: the server side over stdio, its tools declared by macros.
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
# Local sockets on every platform (a Unix domain socket, a Windows named pipe): agents reach a running editor by one.
interprocess = "2.4"
tokio = { version = "1", features = ["rt", "macros", "io-std", "sync"] }
base64 = "0.22"
anyhow = "1"
sysinfo = { version = "0.40", default-features = false, features = ["gpu", "system"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "persistence"] }
egui_tiles = { version = "0.18", features = ["serde"] }
# Syntax highlighting of the file viewer: its built-in highlighter (C, Python, TOML, JSON, ...), without syntect.
egui_extras = { version = "0.37", default-features = false }
egui_kittest = { version = "0.37", default-features = false, features = ["eframe", "wgpu"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
notify = "8"
# Ending a served mount cleanly on Ctrl-C (`pe2-cli project mount`).
ctrlc = { version = "3", features = ["termination"] }
cpal = "0.15.3"
# SQLite in Rust, for the project cache's index (no C to build for any target). Pinned: it is pre-1.0. Its default
# features bring mimalloc (C) and full-text search, which the cache needs neither of.
turso = { version = "=0.8.3", default-features = false }
pollster = "0.4"
# Turso's `branches` takes a path current nightlies removed (core::intrinsics::abort) unless its std feature is on.
branches = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
png = "0.18"
miniz_oxide = "0.8"
crc32fast = "1"
quick-xml = "0.41"
sha1 = "0.10"
sha2 = "0.10"
# What an extension's setup fetches (crates/setup): HTTPS, and the archives it comes in.
ureq = "2"
flate2 = "1"
# What a setup's .tar.xz downloads are read with: pure Rust, decoding only.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "optimization"] }
tar = "0.4"
toml = { version = "0.8", features = ["preserve_order"] }
# Edits to project.toml that keep its comments and layout; the version `toml` reads with.
toml_edit = "0.22"
# Line diffs, for three-way merges of text (`project::merge::lines`).
similar = "3"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

# Debug builds: line tables (file:line in backtraces) and no more, kept in the object files rather than the binary:
# what tests, panics and profiles need, at a fraction of full debug info's size - the editor's test binary was 340 MB
# with it, and every build Cargo keeps of every crate carried its own. The dependencies, most of the code (wasmtime,
# Turso, wgpu, egui), are lightly optimized: the editor runs about three times faster (opening a project 3.5 s, not
# 10.5), for about 70 s more on a clean build.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

# For a debugger: as dev, with full debug info for the workspace's crates - their locals, types and inlined frames
# (`cargo build --profile debugging`, into target/debugging).
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.debugging.package."*"]
debug = "line-tables-only"
opt-level = 1

# Release builds carry no symbols.
[profile.release]
strip = true

# For a sampling profiler (`perf`): release, with the symbols and line tables it reads (`cargo build --profile profiling`,
# into target/profiling).
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

# What we ship: release, optimized across crates as one (`cargo build --profile dist`). Slower to build than release,
# which stays the everyday optimized build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
